[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gdtf = "0.3"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png"] }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = "0.30"
pollster = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# Dependencies (wgpu, egui, image, ...) are optimised even in dev builds; our own crates
# stay quick to compile. Debug frames go from ~9 ms to close to release speed.
[profile.dev.package."*"]
opt-level = 2

# Release builds keep symbols so `sample` / Instruments show function names.
[profile.release]
debug = "line-tables-only"
